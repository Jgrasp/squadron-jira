[package]
name = "jira"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
squadron_extension_api = { git = "https://github.com/Jgrasp/squadron-extensions" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true
